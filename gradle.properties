# Project-wide Gradle settings.
# v1.1.0：沙箱 4G 内存下构建 —— Gradle 1G + Kotlin 守护进程 1G，
# 避免 2G+2G 双守护进程触发 cgroup OOM 被杀
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# LinBrowser 构建环境（沙箱无系统 JDK，使用用户目录 Corretto 17）
# 本地 Android Studio 构建时可删除此行（自动用 IDE JDK）
org.gradle.java.home=/home/z/amazon-corretto-17.0.21.1.2-linux-x64
