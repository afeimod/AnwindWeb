# Project-wide Gradle settings.
# v1.1.0：沙箱 4G 内存下构建 —— Gradle 1G + Kotlin 守护进程 1G，
# 避免 2G+2G 双守护进程触发 cgroup OOM 被杀
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# JDK 说明：不在此文件固定 org.gradle.java.home（机器路径不同会直接构建失败）。
# 本地构建请用环境变量 JAVA_HOME 指向 JDK 17；Android Studio 自动用 IDE JDK；
# GitHub Actions 由 actions/setup-java 自动设置。
