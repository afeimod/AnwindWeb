name: Build LinBrowser APK

# 手动触发构建（Actions 页面 → Run workflow）
# v1.1.0：用户要求 —— GitHub 构建 yml，手动触发
on:
  workflow_dispatch:
    inputs:
      buildType:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build APK (${{ inputs.buildType || 'both' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v3

      # v1.2.1：清理机器相关的本地配置（若被误提交会导致 CI 必挂）
      # - local.properties：本机 SDK 路径，CI 用 runner 自带 ANDROID_HOME
      # - org.gradle.java.home：本机 JDK 路径，CI 用 setup-java 装的 JDK
      - name: Sanitize machine-specific configs
        run: |
          rm -f local.properties
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          echo "--- gradle.properties after sanitize ---"
          cat gradle.properties

      # v1.2.1：确保 SDK 34 平台与构建工具就位并接受许可（已装则为空操作）
      - name: Ensure Android SDK 34 components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        if: ${{ inputs.buildType == 'debug' || inputs.buildType == 'both' || inputs.buildType == '' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        if: ${{ inputs.buildType == 'release' || inputs.buildType == 'both' || inputs.buildType == '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK artifact
        if: ${{ inputs.buildType == 'debug' || inputs.buildType == 'both' || inputs.buildType == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LinBrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: ${{ inputs.buildType == 'release' || inputs.buildType == 'both' || inputs.buildType == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LinBrowser-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
